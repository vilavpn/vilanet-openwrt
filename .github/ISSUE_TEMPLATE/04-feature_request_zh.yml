name: 功能请求（中文）
description: 提交一个具体、可评估的 VilaNet OpenWrt 客户端功能请求。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **请写清楚你要解决的具体场景。过于模糊的请求会被关闭。**

        不要只写「加个功能」「优化一下」。请说明功能范围、请求类型、当前问题，以及你希望新增或改变的**具体行为**。

  - type: dropdown
    id: area
    attributes:
      label: 功能范围
      description: 这个请求属于哪一类？**请手动选择，不要保留默认占位符。**
      options:
        - "⚠️ 请选择功能范围（保留此项会被视为无效提交并关闭）"
        - 连接模式（global / rule）
        - 账号 / 登录
        - DNS（dns_mode / bypass_china 等）
        - 局域网共享（LAN sharing）
        - 路由与分流（bypass）
        - LuCI 网页界面
        - UCI 配置项
        - ubus / init.d
        - 自动更新
        - 诊断与日志
        - 其他
    validations:
      required: true

  - type: dropdown
    id: request_type
    attributes:
      label: 请求类型
      description: 你希望我们做哪类改变？**请手动选择，不要保留默认占位符。**
      options:
        - "⚠️ 请选择请求类型（保留此项会被视为无效提交并关闭）"
        - 新增 UCI 配置项
        - 新增 ubus 方法
        - 新增 LuCI 控件
        - 改进现有行为
        - 改进文档
        - 增加路由器 / 架构支持
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前问题或使用场景
      description: 现在哪里不方便、缺失或容易误解？请描述真实场景。
      placeholder: |
        例如：希望能在 LuCI 里按域名 / IP 段添加自定义分流规则，目前只能全局或按内置规则走，无法让某个内网设备直连。
    validations:
      required: true

  - type: textarea
    id: requested_behavior
    attributes:
      label: 你希望新增或改变什么？
      description: 请写成具体行为，而不是只写一个概念。
      placeholder: |
        例如：在 Settings 增加一个自定义规则列表（源 IP / 目标域名 → direct / proxy），并写入 `vilanet.rules.*` 的 UCI 配置。
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 影响程度
      description: 这个功能对用户有什么影响？**请手动选择，不要保留默认占位符。**
      options:
        - "⚠️ 请选择影响程度（保留此项会被视为无效提交并关闭）"
        - 只是使用更方便
        - 影响部分路由器
        - 影响某一架构 / 型号家族
        - 阻塞了某个工作流程
        - 不确定
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 补充信息（可选）
      description: 相关链接、示例配置、其他工具的做法、相关 issue 等。
      placeholder: "可以放示例配置、文档链接、相关 issue 链接等。"
    validations:
      required: false

  - type: checkboxes
    id: integrity
    attributes:
      label: 提交确认
      description: 请勾选每一项。
      options:
        - label: "我已搜索现有 issues，确认这不是重复请求。"
          required: true
        - label: "我已选择具体的功能范围和请求类型。"
          required: true
        - label: "我已说明当前问题或使用场景，以及希望新增或改变的具体行为。"
          required: true
        - label: "我理解只写「加个功能」「优化一下」这类模糊描述会被关闭。"
          required: true
