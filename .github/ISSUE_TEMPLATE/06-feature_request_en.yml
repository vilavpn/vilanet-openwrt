name: Feature request (English)
description: Request a specific, actionable VilaNet OpenWrt client feature.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Describe the concrete scenario you want solved. Vague requests will be closed.**

        Do not just write "add a feature" or "improve it". Tell us the feature area, request type, current problem, and the exact **behavior** you want changed or added.

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      description: Which area does this belong to? **Please pick manually — do not leave the placeholder selected.**
      options:
        - "⚠️ Please select a feature area (leaving this counts as an invalid submission and will be closed)"
        - Connection mode (global / rule)
        - Account / login
        - DNS (dns_mode / bypass_china, etc.)
        - LAN sharing
        - Routing & bypass
        - LuCI web UI
        - UCI config keys
        - ubus / init.d
        - Auto-update
        - Diagnostics & logging
        - Other
    validations:
      required: true

  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      description: What kind of change are you asking for? **Please pick manually — do not leave the placeholder selected.**
      options:
        - "⚠️ Please select a request type (leaving this counts as an invalid submission and will be closed)"
        - New UCI option
        - New ubus method
        - New LuCI control
        - Improve existing behavior
        - Improve docs
        - Add router / architecture support
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Current problem or user scenario
      description: What is missing, confusing, or inconvenient today? Describe the real scenario.
      placeholder: |
        Example: I want to add custom split-routing rules by domain / IP range in LuCI. Today it is global or built-in rules only, so I cannot make one LAN device go direct.
    validations:
      required: true

  - type: textarea
    id: requested_behavior
    attributes:
      label: What should change?
      description: Describe the exact behavior you want, not just a broad idea.
      placeholder: |
        Example: Add a custom rule list in Settings (source IP / destination domain → direct / proxy) that writes to `vilanet.rules.*` UCI config.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How does this affect users? **Please pick manually — do not leave the placeholder selected.**
      options:
        - "⚠️ Please select an impact level (leaving this counts as an invalid submission and will be closed)"
        - Convenience improvement
        - Affects some routers
        - Affects an architecture / model family
        - Blocks a workflow
        - Not sure
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Extra context (optional)
      description: Related links, example config, how other tools do it, related issues.
      placeholder: "Add example config, doc links, related issue links, etc."
    validations:
      required: false

  - type: checkboxes
    id: integrity
    attributes:
      label: Submission checklist
      description: Please check every item.
      options:
        - label: "I searched existing issues and confirmed this is not a duplicate."
          required: true
        - label: "I selected a specific feature area and request type."
          required: true
        - label: "I explained the current problem or user scenario and the specific behavior I want changed or added."
          required: true
        - label: "I understand that vague requests like 'add a feature' or 'improve it' will be closed."
          required: true
